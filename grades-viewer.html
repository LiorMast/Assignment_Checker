<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עורך ציונים</title>
<style>
  :root {
    --bg: #f6f6f3; --surface: #ffffff; --sunken: #f1f1ec; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4de;
    --accent: #3b5bdb; --accent-soft: #e8ecfd; --on-accent: #ffffff;
    --bad: #b93225; --bad-soft: #fbe9e6; --warn: #a45a07; --warn-soft: #fdf1d3; --good: #26734a; --good-soft: #e2f3e9;
    --edit: #7048b8; --edit-soft: #f0eafb;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 8px 24px -12px rgb(0 0 0 / 0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141513; --surface: #1d1e1c; --sunken: #181917; --text: #ecece8; --muted: #a3a39c; --line: #31322e;
      --accent: #93a5fb; --accent-soft: #252b4a; --on-accent: #12142a;
      --bad: #f28b7f; --bad-soft: #3b1f1b; --warn: #efb65f; --warn-soft: #382c12; --good: #7bcb9b; --good-soft: #17301f;
      --edit: #c3a6f5; --edit-soft: #2c2340;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 16px 96px; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  [hidden] { display: none !important; }
  code { direction: ltr; unicode-bidi: isolate; font-size: 0.875em; background: var(--sunken); padding: 1px 6px; border-radius: 5px; }

  /* Buttons and fields */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 9px; padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: background-color .15s, border-color .15s;
    text-decoration: none;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.small { padding: 5px 10px; font-size: 14px; }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.ghost:hover:not(:disabled) { background: var(--sunken); border-color: transparent; }
  .btn.danger { color: var(--bad); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 0; background: none;
    color: var(--muted); cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--sunken); color: var(--text); }
  .icon-btn.danger:hover { color: var(--bad); background: var(--bad-soft); }
  .icon-btn svg { width: 17px; height: 17px; }
  .field {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0;
  }
  .field:hover { border-color: color-mix(in srgb, var(--muted) 60%, var(--line)); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }

  /* Header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status { margin: -8px 0 16px; font-size: 14px; color: var(--muted); }
  .status.ok { color: var(--good); }
  .warning {
    margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn);
  }
  .banner {
    display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--edit-soft); color: var(--edit);
  }

  /* Start screen */
  .drop {
    margin-top: 8vh; padding: 56px 24px; text-align: center; background: var(--surface);
    border: 2px dashed var(--line); border-radius: 18px;
  }
  .drop h2 { margin: 0 0 6px; font-size: 20px; }
  .drop p { margin: 0 0 20px; color: var(--muted); }
  .drop .hint { margin: 18px 0 0; font-size: 13px; }
  body.dragging .drop, body.dragging .list { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .error {
    margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); white-space: pre-line;
  }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 26px; line-height: 1.2; font-weight: 700; }
  .stat span { color: var(--muted); font-size: 13px; }

  /* Toolbar */
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .tools input[type=search], .tools select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; min-height: 40px;
  }
  .tools input[type=search] { flex: 1 1 220px; min-width: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px;
    font-size: 14px; cursor: pointer;
  }
  .chip[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .count { color: var(--muted); font-size: 14px; }
  .meta div { display: flex; gap: 6px; }

  /* Accordion */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .item + .item { border-top: 1px solid var(--line); }
  .head {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; width: 100%;
    padding: 14px 16px; background: none; border: 0; text-align: start; cursor: pointer;
  }
  .item-head { display: flex; align-items: stretch; }
  .item-head:hover { background: var(--sunken); }
  .item-head .head { flex: 1; min-width: 0; padding-inline-start: 4px; }
  .head:focus-visible, .check:focus-visible { outline-offset: -2px; }
  .check {
    flex: none; display: grid; place-items: center; width: 46px; padding: 0; padding-inline-start: 8px;
    border: 0; background: none; cursor: pointer; color: var(--on-accent);
  }
  .check .box {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid color-mix(in srgb, var(--muted) 55%, var(--line));
    display: grid; place-items: center; transition: background-color .15s, border-color .15s;
  }
  .check .box svg { width: 15px; height: 15px; opacity: 0; transition: opacity .15s; }
  .check:hover .box { border-color: var(--good); }
  .check[aria-pressed=true] .box { background: var(--good); border-color: var(--good); }
  .check[aria-pressed=true] .box svg { opacity: 1; }
  .item.checked .name > span:first-child { color: var(--muted); }
  .who { min-width: 0; }
  .name { font-weight: 650; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ids { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .tag { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .tag.edit { background: var(--edit-soft); color: var(--edit); }
  .tag.done { background: var(--good-soft); color: var(--good); }
  .brief { color: var(--muted); font-size: 14px; white-space: nowrap; text-align: end; }
  .brief .minus { color: var(--bad); font-weight: 600; }
  .grade {
    min-width: 58px; text-align: center; padding: 5px 10px; border-radius: 10px; font-size: 20px; font-weight: 700;
    background: var(--sunken); color: var(--muted);
  }
  .grade.good { background: var(--good-soft); color: var(--good); }
  .grade.mid { background: var(--warn-soft); color: var(--warn); }
  .grade.low { background: var(--bad-soft); color: var(--bad); }
  .grade.manual { box-shadow: inset 0 0 0 2px var(--edit); }
  .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s ease; flex: none; }
  .item.open .chev { transform: rotate(180deg); }
  .end { display: flex; align-items: center; gap: 12px; }

  .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
  .item.open .panel { grid-template-rows: 1fr; }
  .inner { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s .22s; }
  .item.open .inner { visibility: visible; transition-delay: 0s; }
  .body { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 12px; }

  /* Manual review */
  .reviews { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px 10px 14px; font-size: 14px; }
  .reviews strong { display: block; margin-bottom: 4px; }
  .reviews ul { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .reviews li { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .reviews li > span { overflow-wrap: anywhere; min-width: 0; }
  .reviews li.done > span { text-decoration: line-through; opacity: .7; }
  .reviews .btn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: transparent; }
  .reviews .note-tag { font-size: 12px; font-weight: 600; margin-inline-end: 6px; }
  .note-row { display: flex; gap: 8px; }
  .note-row input { flex: 1; background: var(--surface); }
  .review-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* Comments of a group */
  .flags { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .flag { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 10px; padding: 10px 10px 10px 8px; align-items: start; padding-inline-start: 14px; }
  .flag + .flag { border-top: 1px solid var(--line); }
  .flag.changed { background: color-mix(in srgb, var(--edit-soft) 55%, transparent); }
  .no {
    font-size: 13px; font-weight: 600; text-align: center; padding: 2px 0; border-radius: 6px; margin-top: 4px;
    background: var(--sunken); color: var(--muted);
  }
  .text { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
  .text .mark { font-size: 12px; font-weight: 600; color: var(--edit); margin-inline-start: 6px; white-space: nowrap; }
  .detail {
    display: block; width: 100%; margin-top: 4px; padding: 3px 8px; border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 14px; resize: none; field-sizing: content; min-height: 28px;
    border-inline-start: 2px solid var(--line); border-start-start-radius: 0; border-end-start-radius: 0;
  }
  .detail:hover { border-color: var(--line); }
  .detail:focus { border-color: var(--accent); color: var(--text); background: var(--surface); outline: none; }
  .detail::placeholder { color: color-mix(in srgb, var(--muted) 55%, transparent); }
  .pts-field { display: flex; align-items: center; gap: 4px; color: var(--bad); font-weight: 700; padding-top: 1px; }
  .pts-field input {
    width: 58px; text-align: center; font-weight: 700; color: var(--bad); padding: 4px 4px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  }
  .flag.note .pts-field, .flag.note .pts-field input { color: var(--muted); font-weight: 500; }
  .flag.removed { background: var(--sunken); }
  .flag.removed .text > span:first-child, .flag.removed .no { text-decoration: line-through; color: var(--muted); }
  .flag.removed .gone { color: var(--muted); font-size: 13px; padding-top: 4px; white-space: nowrap; }

  /* Add a comment */
  .adder { position: relative; }
  .adder input { width: 100%; padding: 8px 12px; border-style: dashed; }
  .options {
    position: absolute; inset-inline: 0; top: calc(100% + 4px); z-index: 5; margin: 0; padding: 4px; list-style: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    max-height: 300px; overflow: auto;
  }
  .options button {
    display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; width: 100%; text-align: start; padding: 7px 10px;
    border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 14px; align-items: start;
  }
  .options button:hover, .options button.active { background: var(--accent-soft); }
  .options .o-no { color: var(--muted); font-weight: 600; text-align: center; }
  .options .o-pts { color: var(--bad); font-weight: 600; white-space: nowrap; }
  .options .o-new { grid-template-columns: 1fr; color: var(--accent); font-weight: 600; }
  .new-comment {
    display: grid; grid-template-columns: 1fr 90px auto auto; gap: 8px; align-items: center;
    padding: 10px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--accent-soft);
  }
  .new-comment label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

  /* Grade line */
  .total { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
  .total b { color: var(--text); }
  .grade-edit { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grade-edit input { width: 76px; text-align: center; font-weight: 700; font-size: 17px; padding: 4px 6px; }
  .grade-edit input.manual { border-color: var(--edit); color: var(--edit); }
  .formula { font-size: 14px; }
  .group-actions { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
  .clean { margin: 0; color: var(--good); }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }

  /* Comment pool dialog */
  dialog {
    width: min(960px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; border: 1px solid var(--line);
    border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: 0 24px 60px -20px rgb(0 0 0 / 0.4);
  }
  dialog::backdrop { background: rgb(0 0 0 / 0.35); }
  .dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 50px); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 10px; }
  .dlg-head h2 { margin: 0; font-size: 19px; }
  .dlg-tools { padding: 0 18px 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .dlg-tools input { flex: 1 1 200px; }
  .dlg-body { overflow: auto; padding: 0 18px; flex: 1; }
  .pool { width: 100%; border-collapse: collapse; font-size: 14px; }
  .pool th button {
    display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; cursor: pointer;
    font-weight: 600; color: inherit;
  }
  .pool th button::after { content: '↕'; font-size: 11px; opacity: .35; }
  .pool th[aria-sort=ascending] button::after { content: '↑'; opacity: 1; }
  .pool th[aria-sort=descending] button::after { content: '↓'; opacity: 1; }
  .pool th[aria-sort] { color: var(--text); }
  .pool th { position: sticky; top: 0; background: var(--surface); text-align: start; font-weight: 600; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); z-index: 1; }
  .pool td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .pool tr.changed td { background: color-mix(in srgb, var(--edit-soft) 55%, transparent); }
  .pool .c-no { width: 50px; text-align: center; font-weight: 600; color: var(--muted); padding-top: 12px; }
  .pool textarea { width: 100%; resize: none; field-sizing: content; min-height: 34px; }
  .pool input[type=number] { width: 70px; text-align: center; }
  .pool .label { display: inline-block; padding-top: 6px; color: var(--muted); }
  .pool .uses { white-space: nowrap; }
  .pool .row-actions { white-space: nowrap; width: 1%; }
  .pool .orig { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .dlg-foot {
    display: grid; grid-template-columns: 1fr 100px auto; gap: 8px; align-items: end; padding: 12px 18px 16px;
    border-top: 1px solid var(--line); background: var(--sunken); border-radius: 0 0 16px 16px;
  }
  .dlg-foot label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

  .toast {
    position: fixed; inset-inline: 0; bottom: 20px; margin: 0 auto; width: max-content; max-width: calc(100vw - 32px);
    padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 14px;
    box-shadow: var(--shadow); z-index: 20;
  }

  @media (max-width: 600px) {
    .head { grid-template-columns: 1fr auto; row-gap: 4px; }
    .check { width: 38px; padding-inline-start: 6px; }
    .brief { grid-column: 1; grid-row: 2; text-align: start; }
    .end { grid-column: 2; grid-row: 1 / span 2; }
    .flag { grid-template-columns: 36px 1fr auto; gap: 8px; padding-inline-start: 8px; }
    .flag > .text { grid-row: span 2; }
    .flag > .icon-btn, .flag > .btn { grid-column: 3; grid-row: 2; justify-self: center; align-self: start; }
    .new-comment { grid-template-columns: 1fr 90px; }
    .dlg-foot { grid-template-columns: 1fr 90px; }
    .dlg-foot .btn { grid-column: span 2; justify-content: center; }
    .pool .c-uses-h, .pool .uses { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .panel, .chev, .inner { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <input type="file" id="file" accept=".xlsx" hidden>
  <p class="warning" id="embedded" hidden>הדף פתוח בתוך VS Code (או בתוך מסגרת), ושם אי אפשר לשמור או להוריד קבצים. פתחו את grades-viewer.html מתיקיית הפרויקט ב-Chrome או ב-Edge.</p>
  <p class="error" id="error" role="alert" hidden></p>

  <section class="drop" id="start">
    <h2>עורך ציונים</h2>
    <p>ייבאו את קובץ הציונים שנוצר בבדיקה: <code>results/ex1/grades.xlsx</code></p>
    <button class="btn primary" type="button" data-import>ייבוא קובץ ציונים</button>
    <p class="hint">אפשר גם לגרור את הקובץ לכאן. הקובץ נקרא בדפדפן בלבד ואינו נשלח לשום מקום.</p>
  </section>

  <main id="app" hidden>
    <header class="top">
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="actions">
        <button class="icon-btn" type="button" id="undo" title="ביטול (Ctrl+Z)" aria-label="ביטול"></button>
        <button class="icon-btn" type="button" id="redo" title="חזרה (Ctrl+Y)" aria-label="חזרה"></button>
        <button class="btn" type="button" id="open-pool">טבלת הערות</button>
        <button class="btn" type="button" data-import>ייבוא</button>
        <button class="btn" type="button" id="download" title="הורדת grades.xlsx המעודכן">הורדה</button>
        <button class="btn" type="button" id="download-publish" title="הורדת קובץ ציונים לפרסום לסטודנטים (ציונים וטבלת הערות בלבד)">הורד גרסה לפרסום</button>
        <button class="btn primary" type="button" id="save" title="שמירה (Ctrl+S)">שמירה <span class="dot" id="dirty" hidden></span></button>
      </div>
    </header>
    <p class="status" id="status" aria-live="polite" hidden></p>
    <div class="banner" id="draft" hidden>
      <span id="draft-text"></span>
      <span class="actions">
        <button class="btn small" type="button" id="draft-restore">שחזור הטיוטה</button>
        <button class="btn small ghost" type="button" id="draft-drop">מחיקה</button>
      </span>
    </div>

    <section class="stats" id="stats" aria-label="סיכום"></section>

    <div class="tools">
      <input type="search" id="search" placeholder="חיפוש: קבוצה, ת״ז, טקסט, או #43 למספר הערה" aria-label="חיפוש">
      <select id="sort" aria-label="מיון">
        <option value="group">מיון: קבוצה</option>
        <option value="asc">מיון: ציון מהנמוך לגבוה</option>
        <option value="desc">מיון: ציון מהגבוה לנמוך</option>
      </select>
      <div class="chips" id="filters" role="group" aria-label="סינון">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">הכול</button>
        <button class="chip" type="button" data-filter="deduct" aria-pressed="false">עם הורדות</button>
        <button class="chip" type="button" data-filter="review" aria-pressed="false">לבדיקה ידנית</button>

        <button class="chip" type="button" data-filter="unchecked" aria-pressed="false">לא נבדקו</button>
        <button class="chip" type="button" data-filter="checked" aria-pressed="false">נבדקו</button>

    </div>

    <div class="list" id="list"></div>

</div>

<dialog id="pool" aria-labelledby="pool-title">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="pool-title">טבלת הערות</h2>
      <button class="icon-btn" type="button" id="pool-close" aria-label="סגירה"></button>
    </div>

      <input class="field" type="search" id="pool-search" placeholder="חיפוש הערה: מספר או טקסט" aria-label="חיפוש הערה">
